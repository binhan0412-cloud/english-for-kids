
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>English for Kids - Bài học</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eaf7ed;
      text-align: center;
      padding: 20px;
      color: #333;
    }
    h1 { color: #8b5cf6; }
    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin: 15px auto;
      max-width: 650px;
      box-shadow: 0 3px 12px #0001;
    }
    .word {
      display: inline-block;
      background: #fff3a6;
      border-radius: 16px;
      padding: 15px;
      margin: 8px;
    }
    button {
      background: #3dcc70;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 10px 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>🌈 English for Kids</h1>
  <p>Dữ liệu bài học từ Google Trang tính</p>
  <div id="content">⏳ Đang tải bài học...</div>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbz8BnZPEWIprXuWaUq9LX1whMdw67C30WYD6QL3YgGixgVM7_aP-eWnMOHB0PvYC3XzWw/exec";

    const params = new URLSearchParams(location.search);
    const lessonId = params.get("id") || "GRE_L01";

    function speak(text) {
      speechSynthesis.cancel();
      const voice = new SpeechSynthesisUtterance(text);
      voice.lang = "en-US";
      voice.rate = 0.8;
      speechSynthesis.speak(voice);
    }

    function makeCard(title, items, textKey, viKey) {
      const card = document.createElement("div");
      card.className = "card";

      const heading = document.createElement("h2");
      heading.textContent = title;
      card.appendChild(heading);

      items.forEach(item => {
        const box = document.createElement("div");
        box.className = "word";
const image = document.createElement("img");

image.src = item.IMAGE
    ? new URL(item.IMAGE, window.location.href).href
    : "";
image.alt = item[textKey] || "";
image.style.width = "150px";
image.style.maxWidth = "100%";
image.style.borderRadius = "15px";
image.style.display = item.IMAGE ? "block" : "none";
image.style.margin = "10px auto";

box.appendChild(image);
        const name = document.createElement("h3");
        name.textContent = item[textKey];

        const meaning = document.createElement("p");
        meaning.textContent = item[viKey];

        const button = document.createElement("button");
        button.textContent = "🔊 Listen";
        button.onclick = () => speak(item[textKey]);

        box.append(name, meaning, button);
        card.appendChild(box);
      });

      return card;
    }

    async function loadLesson() {
      const content = document.getElementById("content");

      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error("API không phản hồi");

        const data = await response.json();

        const lesson = (data.LESSONS || []).find(
          item => item.LESSON_ID === lessonId
        );

        if (!lesson) {
          content.textContent = "Chưa tìm thấy bài học: " + lessonId;
          return;
        }

        const words = (data.VOCABULARY || []).filter(
          item => item.LESSON_ID === lessonId
        );

        const sentences = (data.SENTENCES || []).filter(
          item => item.LESSON_ID === lessonId
        );

        content.replaceChildren();

        const title = document.createElement("h2");
        title.textContent = lesson.LESSON_NAME || "Bài học";
        content.appendChild(title);

const songUrl = lesson.SONG_VIDEO || lesson.SONG || "";

if (songUrl) {
    const songBox = document.createElement("div");
    songBox.className = "card";

    const songTitle = document.createElement("h2");
    songTitle.textContent = "🎵 Let's sing! - Cùng hát nào!";
    songBox.appendChild(songTitle);

    
const songPlayer = document.createElement("audio");
songPlayer.controls = true;
songPlayer.preload = "none";
songPlayer.style.width = "100%";
songPlayer.style.maxWidth = "400px";

songPlayer.src = songUrl;


songBox.appendChild(songPlayer);


    content.appendChild(songBox);
}

        content.appendChild(
          makeCard("🍎 Từ vựng", words, "WORD", "WORD_VI")
        );

const wordPracticeBox = document.createElement("div");
wordPracticeBox.className = "card";

const wordPracticeTitle = document.createElement("h2");
wordPracticeTitle.textContent = "🎤 Bé luyện đọc từ vựng";
wordPracticeBox.appendChild(wordPracticeTitle);

const wordPracticeGuide = document.createElement("p");
wordPracticeGuide.textContent = "Con hãy nghe và đọc từng từ nhé!";
wordPracticeBox.appendChild(wordPracticeGuide);

let currentWord = 0;

const wordTarget = document.createElement("h2");
wordTarget.textContent = words.length
    ? words[0].WORD
    : "Chưa có từ vựng";
wordPracticeBox.appendChild(wordTarget);

const wordListenBtn = document.createElement("button");
wordListenBtn.textContent = "🔊 Nghe mẫu";
wordListenBtn.onclick = () => {
    if (words[currentWord]) {
        speak(words[currentWord].WORD);
    }
};
wordPracticeBox.appendChild(wordListenBtn);

const wordSpeakBtn = document.createElement("button");
wordSpeakBtn.textContent = "🎤 Bé đọc";
wordSpeakBtn.style.marginLeft = "10px";

const wordResult = document.createElement("p");
wordPracticeBox.appendChild(wordResult);

wordSpeakBtn.onclick = () => {
    if (!words.length) return;

    const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        wordResult.textContent = "Trình duyệt chưa hỗ trợ nhận diện giọng nói.";
        return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    wordResult.textContent = "🎤 Cô đang nghe con đọc...";
    wordSpeakBtn.disabled = true;

    recognition.onresult = (event) => {
        const heard = event.results[0][0].transcript
            .toLowerCase().replace(/[.,!?]/g, "").trim();

        const target = words[currentWord].WORD
            .toLowerCase().replace(/[.,!?]/g, "").trim();

        if (heard === target) {
            wordResult.textContent = "🌟 Giỏi lắm! Con đọc đúng rồi!";
            speak("Great job!");

            currentWord++;

            if (currentWord < words.length) {
                wordTarget.textContent = words[currentWord].WORD;
            } else {
                wordResult.textContent =
                    "🎉 Tuyệt vời! Con đã hoàn thành phần luyện đọc từ vựng!";
                speak("Excellent!");
                currentWord = 0;
                wordTarget.textContent = words[0].WORD;
            }
        } else {
            wordResult.textContent =
                "😊 Cô nghe được: " + heard + ". Con thử lại nhé!";
        }
    };

    recognition.onerror = () => {
        wordResult.textContent = "😊 Con thử đọc lại nhé!";
        wordSpeakBtn.disabled = false;
    };

    recognition.onend = () => {
        wordSpeakBtn.disabled = false;
    };

    recognition.start();
};

wordPracticeBox.appendChild(wordSpeakBtn);
        
const recordBtn = document.createElement("button");
recordBtn.textContent = "🔴 Ghi âm";
recordBtn.style.margin = "10px";

const stopRecordBtn = document.createElement("button");
stopRecordBtn.textContent = "⏹️ Dừng ghi";
stopRecordBtn.disabled = true;

const playback = document.createElement("audio");
playback.controls = true;
playback.style.display = "none";
playback.style.margin = "15px auto";

let recorder;
let recordedChunks = [];
let recordingUrl = null;
let recordingStream = null;

recordBtn.onclick = async () => {
    try {
        if (!navigator.mediaDevices?.getUserMedia ||
            !window.MediaRecorder) {
            alert("Trình duyệt chưa hỗ trợ ghi âm.");
            return;
        }

        recordingStream = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        recordedChunks = [];
        recorder = new MediaRecorder(recordingStream);

        recorder.ondataavailable = (event) => {
            if (event.data.size > 0) {
                recordedChunks.push(event.data);
            }
        };

        recorder.onstop = () => {
            const blob = new Blob(recordedChunks, {
                type: recorder.mimeType
            });

            if (recordingUrl) {
                URL.revokeObjectURL(recordingUrl);
            }

            recordingUrl = URL.createObjectURL(blob);
            playback.src = recordingUrl;
            playback.style.display = "block";

            recordingStream.getTracks().forEach(track => track.stop());
            recordingStream = null;
        };

        recorder.start();
        recordBtn.disabled = true;
        stopRecordBtn.disabled = false;
        playback.style.display = "none";
// Tự động dừng ghi âm sau 5 giây
setTimeout(() => {
    if (recorder && recorder.state === "recording") {
        recorder.stop();
        recordBtn.disabled = false;
        stopRecordBtn.disabled = true;
    }
}, 5000);
    } catch (error) {
        if (recordingStream) {
            recordingStream.getTracks().forEach(track => track.stop());
            recordingStream = null;
        }
        alert("Chị hãy cho phép ứng dụng sử dụng micro nhé!");
    }
};

stopRecordBtn.onclick = () => {
    if (recorder && recorder.state === "recording") {
        recorder.stop();
        recordBtn.disabled = false;
        stopRecordBtn.disabled = true;
    }
};

wordPracticeBox.appendChild(recordBtn);
wordPracticeBox.appendChild(stopRecordBtn);
wordPracticeBox.appendChild(playback);

content.appendChild(wordPracticeBox);

        content.appendChild(
          makeCard("💬 Mẫu câu", sentences, "SENTENCE", "SENTENCE_VI")
        );

const practiceBox = document.createElement("div");
practiceBox.className = "card";

const practiceTitle = document.createElement("h2");
practiceTitle.textContent = "🎤 Your turn! - Bé tập nói";
practiceBox.appendChild(practiceTitle);

const practiceText = document.createElement("h3");
practiceText.textContent = "Con hãy nghe và nói theo nhé!";
practiceBox.appendChild(practiceText);

let currentSentence = 0;

const targetText = document.createElement("h2");
targetText.textContent = sentences.length
    ? sentences[0].SENTENCE
    : "Chưa có mẫu câu";
practiceBox.appendChild(targetText);

const listenBtn = document.createElement("button");
listenBtn.textContent = "🔊 Nghe mẫu";
listenBtn.onclick = () => {
    if (sentences[currentSentence]) {
        speak(sentences[currentSentence].SENTENCE);
    }
};
practiceBox.appendChild(listenBtn);

const speakBtn = document.createElement("button");
speakBtn.textContent = "🎤 Bé nói";
speakBtn.style.marginLeft = "10px";

const result = document.createElement("p");
practiceBox.appendChild(result);

speakBtn.onclick = () => {
    const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        result.textContent = "Trình duyệt chưa hỗ trợ nhận diện giọng nói.";
        return;
    }

    if (!sentences.length) return;

    const recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.interimResults = false;

    result.textContent = "🎤 Đang nghe con nói...";

    recognition.onresult = (event) => {
        const heard = event.results[0][0].transcript
            .toLowerCase()
            .replace(/[.,!?]/g, "")
            .trim();

        const target = sentences[currentSentence].SENTENCE
            .toLowerCase()
            .replace(/[.,!?]/g, "")
            .trim();

        
if (
    heard === target ||
    (target === "hello i'm mai" &&
        ["hello am i", "hello i'm my", "hello my"].includes(heard)) ||
    (target === "goodbye mai" &&
        ["goodbye my", "goodbye may"].includes(heard))
) {

            result.textContent = "🌟 Giỏi lắm! Con đã nói đúng!";
            speak("Great job!");

            currentSentence++;

            if (currentSentence < sentences.length) {
                targetText.textContent =
                    sentences[currentSentence].SENTENCE;
            } else {
                result.textContent =
                    "🎉 Tuyệt vời! Con đã hoàn thành phần luyện nói!";
                speak("Excellent!");
                currentSentence = 0;
                targetText.textContent = sentences[0].SENTENCE;
            }
        } else {
            result.textContent =
                "😊 Cô nghe được: " + heard + ". Con thử lại nhé!";
        }
    };

    recognition.onerror = () => {
        result.textContent = "😊 Con thử nói lại nhé!";
    };

    recognition.start();
};

practiceBox.appendChild(speakBtn);
content.appendChild(practiceBox);

      } catch (error) {
        content.textContent =
          "Không tải được dữ liệu. Hãy kiểm tra API và quyền truy cập.";
        console.error(error);
      }
    }

    loadLesson();
  </script>
</body>
</html>
