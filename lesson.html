
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>English for Kids - Bài học</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eaf7ed;
      text-align: center;
      padding: 20px;
      color: #333;
    }
    h1 { color: #8b5cf6; }
    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin: 15px auto;
      max-width: 650px;
      box-shadow: 0 3px 12px #0001;
    }
    .word {
      display: inline-block;
      background: #fff3a6;
      border-radius: 16px;
      padding: 15px;
      margin: 8px;
    }
    button {
      background: #3dcc70;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 10px 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>🌈 English for Kids</h1>
  <p>Dữ liệu bài học từ Google Trang tính</p>
  <div id="content">⏳ Đang tải bài học...</div>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbz8BnZPEWIprXuWaUq9LX1whMdw67C30WYD6QL3YgGixgVM7_aP-eWnMOHB0PvYC3XzWw/exec";

    const params = new URLSearchParams(location.search);
    const lessonId = params.get("lesson") || params.get("id") || "GRE_L01";

    function speak(text) {
      speechSynthesis.cancel();
      const voice = new SpeechSynthesisUtterance(text);
      voice.lang = "en-US";
      voice.rate = 0.8;
      speechSynthesis.speak(voice);
    }

    // Chuẩn hóa câu nói để tránh bắt lỗi do dấu câu hoặc khoảng trắng.
    function normalizeSpeech(value) {
      return String(value || "")
        .toLowerCase()
        .replace(/[’‘]/g, "'")
        .replace(/[^a-z0-9'\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    // Chỉ phát giọng máy một lần nếu tệp âm thanh bị lỗi.
    function playLearningAudio(url, fallbackText) {
      const source = String(url || "").trim();
      if (!source) {
        speak(fallbackText);
        return;
      }
      speechSynthesis.cancel();
      const audio = new Audio(source);
      let fallbackUsed = false;
      const fallback = () => {
        if (fallbackUsed) return;
        fallbackUsed = true;
        speak(fallbackText);
      };
      audio.addEventListener("error", fallback, { once: true });
      audio.play().catch(fallback);
    }

    // Cho phép một số khác biệt nhỏ trong nhận diện tiếng Anh của trẻ.
    function speechMatches(heard, target) {
      const a = normalizeSpeech(heard);
      const b = normalizeSpeech(target);
      if (!a || !b) return false;
      if (a === b || a.replace(/'/g, "") === b.replace(/'/g, "")) return true;
      // Không tự động chấp nhận từ khác hẳn; chỉ nới lỏng cho câu nhiều từ.
      const aWords = a.split(" ");
      const bWords = b.split(" ");
      if (bWords.length < 3) return false;
      const common = bWords.filter((w, i) => aWords[i] === w).length;
      return aWords.length === bWords.length && common >= bWords.length - 1;
    }

    function isActive(item) {
      const value = item.ACTIVE;
      return value === undefined || value === null || value === "" ||
        value === true || String(value).trim().toUpperCase() === "TRUE" ||
        String(value).trim() === "1";
    }

    function makeCard(title, items, textKey, viKey) {
      const card = document.createElement("div");
      card.className = "card";

      const heading = document.createElement("h2");
      heading.textContent = title;
      card.appendChild(heading);

      items.forEach(item => {
        const box = document.createElement("div");
        box.className = "word";
const image = document.createElement("img");

image.src = item.IMAGE
    ? new URL(item.IMAGE, window.location.href).href
    : "";
image.alt = item[textKey] || "";
image.style.width = "150px";
image.style.maxWidth = "100%";
image.style.borderRadius = "15px";
image.style.display = item.IMAGE ? "block" : "none";
image.style.margin = "10px auto";

box.appendChild(image);
        const name = document.createElement("h3");
        name.textContent = item[textKey];

        const meaning = document.createElement("p");
        meaning.textContent = item[viKey];

        const button = document.createElement("button");
        button.textContent = "🔊 Listen";
        button.onclick = () => playLearningAudio(item.AUDIO, item[textKey]);

box.append(name, meaning, button);
        card.appendChild(box);
      });

      return card;
    }

    async function loadLesson() {
      const content = document.getElementById("content");

      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error("API không phản hồi");

        const data = await response.json();

        const lesson = (data.LESSONS || []).find(
          item => item.LESSON_ID === lessonId && isActive(item)
        );

        if (!lesson) {
          content.textContent = "Chưa tìm thấy bài học: " + lessonId;
          return;
        }

        const words = (data.VOCABULARY || []).filter(
          item => item.LESSON_ID === lessonId && isActive(item)
        );

        const sentences = (data.SENTENCES || []).filter(
          item => item.LESSON_ID === lessonId && isActive(item)
        );

        content.replaceChildren();

        const title = document.createElement("h2");
        title.textContent = lesson.LESSON_NAME || "Bài học";
        content.appendChild(title);

const songUrl = lesson.SONG_VIDEO || lesson.SONG || "";

if (songUrl) {
    const songBox = document.createElement("div");
    songBox.className = "card";

    const songTitle = document.createElement("h2");
    songTitle.textContent = "🎵 Let's sing! - Cùng hát nào!";
    songBox.appendChild(songTitle);

    
const songPlayer = document.createElement("video");
songPlayer.controls = true;
songPlayer.preload = "none";
songPlayer.style.width = "100%";
songPlayer.style.maxWidth = "650px";
songPlayer.style.aspectRatio = "16 / 9";
songPlayer.style.objectFit = "contain";
songPlayer.style.borderRadius = "12px";

songPlayer.src = songUrl;


songBox.appendChild(songPlayer);


    content.appendChild(songBox);
}

        content.appendChild(
          makeCard("🍎 Từ vựng", words, "WORD", "WORD_VI")
        );

const wordPracticeBox = document.createElement("div");
wordPracticeBox.className = "card";

const wordPracticeTitle = document.createElement("h2");
wordPracticeTitle.textContent = "🎤 Bé luyện đọc từ vựng";
wordPracticeBox.appendChild(wordPracticeTitle);

const wordPracticeGuide = document.createElement("p");
wordPracticeGuide.textContent = "Con hãy nghe và đọc từng từ nhé!";
wordPracticeBox.appendChild(wordPracticeGuide);

let currentWord = 0;
let pronunciationAttempts = 0;
const wordTarget = document.createElement("h2");
wordTarget.textContent = words.length
    ? words[0].WORD
    : "Chưa có từ vựng";
wordPracticeBox.appendChild(wordTarget);

const wordListenBtn = document.createElement("button");
wordListenBtn.textContent = "🔊 Nghe mẫu";
wordListenBtn.onclick = () => {
    if (words[currentWord]) {
        speak(words[currentWord].WORD);
    }
};
wordPracticeBox.appendChild(wordListenBtn);

const wordSpeakBtn = document.createElement("button");
wordSpeakBtn.textContent = "🎤 Bé đọc";
wordSpeakBtn.style.marginLeft = "10px";

const wordResult = document.createElement("p");
wordPracticeBox.appendChild(wordResult);

wordSpeakBtn.onclick = () => {
    if (!words.length) return;

    const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        wordResult.textContent = "Trình duyệt chưa hỗ trợ nhận diện giọng nói.";
        return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.interimResults = false;
    recognition.maxAlternatives = 3;
    wordResult.textContent = "🎤 Cô đang nghe con đọc...";
    wordSpeakBtn.disabled = true;

    recognition.onresult = (event) => {
        if (!words[currentWord]) return;
        const alternatives = Array.from(event.results[0] || [])
            .map(result => result.transcript);
        const heard = alternatives[0] || "";
        const target = words[currentWord].WORD;
        const correct = alternatives.some(text => speechMatches(text, target));

        if (correct) {
            pronunciationAttempts = 0;
            wordResult.textContent = "🌟 Giỏi lắm! Con đọc đúng rồi!";
            speak("Great job!");
        } else {
            pronunciationAttempts++;
            if (pronunciationAttempts < 3) {
                wordResult.textContent =
                    "😊 Cô nghe được: " + heard +
                    ". Con thử lại nhé! (" + pronunciationAttempts + "/3 lần)";
                return;
            }
            pronunciationAttempts = 0;
            wordResult.textContent =
                "🌷 Con đã rất cố gắng! Mình học từ tiếp theo nhé!";
        }

        currentWord++;
        if (currentWord < words.length) {
            wordTarget.textContent = words[currentWord].WORD;
        } else {
            wordResult.textContent =
                "🎉 Tuyệt vời! Con đã hoàn thành phần luyện đọc từ vựng!";
            speak("Excellent!");
            currentWord = 0;
            wordTarget.textContent = words[0].WORD;
        }
    };

   recognition.onerror = () => {
    wordResult.textContent =
        "😊 Cô chưa nghe rõ. Con thử đọc lại nhé!";
};

    recognition.onend = () => {
        wordSpeakBtn.disabled = false;
    };

    recognition.start();
};

wordPracticeBox.appendChild(wordSpeakBtn);
        
const recordBtn = document.createElement("button");
recordBtn.textContent = "🔴 Ghi âm";
recordBtn.style.margin = "10px";

const stopRecordBtn = document.createElement("button");
stopRecordBtn.textContent = "⏹️ Dừng ghi";
stopRecordBtn.disabled = true;

const playback = document.createElement("audio");
playback.controls = true;
playback.style.display = "none";
playback.style.margin = "15px auto";
const countdown = document.createElement("h2");
countdown.textContent = "";
countdown.style.color = "#ff5f7e";
countdown.style.fontSize = "32px";
countdown.style.margin = "15px 0";
let recorder;
let recordedChunks = [];
let recordingUrl = null;
let recordingStream = null;
let countdownTimer = null;

recordBtn.onclick = async () => {
    try {
        if (!navigator.mediaDevices?.getUserMedia ||
            !window.MediaRecorder) {
            alert("Trình duyệt chưa hỗ trợ ghi âm.");
            return;
        }

        recordingStream = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        recordedChunks = [];
        recorder = new MediaRecorder(recordingStream);

        recorder.ondataavailable = (event) => {
            if (event.data.size > 0) {
                recordedChunks.push(event.data);
            }
        };

        recorder.onstop = () => {
            clearInterval(countdownTimer);
            const blob = new Blob(recordedChunks, {
                type: recorder.mimeType
            });

            if (recordingUrl) {
                URL.revokeObjectURL(recordingUrl);
            }

            recordingUrl = URL.createObjectURL(blob);
            playback.src = recordingUrl;
            playback.style.display = "block";

            recordingStream.getTracks().forEach(track => track.stop());
            recordingStream = null;
        };

        recorder.start();
        recordBtn.disabled = true;
        stopRecordBtn.disabled = false;
        playback.style.display = "none";
// Đồng hồ đếm ngược 5 giây
clearInterval(countdownTimer);
let secondsLeft = 5;
countdown.textContent = "⏱️ " + secondsLeft;

countdownTimer = setInterval(() => {
    if (!recorder || recorder.state !== "recording") {
        clearInterval(countdownTimer);
        countdown.textContent = "";
        return;
    }

    secondsLeft--;
    countdown.textContent = "⏱️ " + secondsLeft;

    if (secondsLeft <= 0) {
        clearInterval(countdownTimer);
        recorder.stop();
        recordBtn.disabled = false;
        stopRecordBtn.disabled = true;
        countdown.textContent = "🌟 Con hãy nghe lại nhé!";
    }
}, 1000);
    } catch (error) {
        if (recordingStream) {
            recordingStream.getTracks().forEach(track => track.stop());
            recordingStream = null;
        }
        alert("Chị hãy cho phép ứng dụng sử dụng micro nhé!");
    }
};

stopRecordBtn.onclick = () => {
    if (recorder && recorder.state === "recording") {
        clearInterval(countdownTimer);
        recorder.stop();
        recordBtn.disabled = false;
        stopRecordBtn.disabled = true;
      countdown.textContent = "🌟 Con hãy nghe lại nhé!";
    }
};

wordPracticeBox.appendChild(recordBtn);
wordPracticeBox.appendChild(stopRecordBtn);
        wordPracticeBox.appendChild(countdown);
wordPracticeBox.appendChild(playback);

content.appendChild(wordPracticeBox);

        content.appendChild(
          makeCard("💬 Mẫu câu", sentences, "SENTENCE", "SENTENCE_VI")
        );

const practiceBox = document.createElement("div");
practiceBox.className = "card";

const practiceTitle = document.createElement("h2");
practiceTitle.textContent = "🎤 Your turn! - Bé tập nói";
practiceBox.appendChild(practiceTitle);

const practiceText = document.createElement("h3");
practiceText.textContent = "Con hãy nghe và nói theo nhé!";
practiceBox.appendChild(practiceText);

let currentSentence = 0;
let sentenceAttempts = 0;

const targetText = document.createElement("h2");
targetText.textContent = sentences.length
    ? sentences[0].SENTENCE
    : "Chưa có mẫu câu";
practiceBox.appendChild(targetText);

const listenBtn = document.createElement("button");
listenBtn.textContent = "🔊 Nghe mẫu";
listenBtn.onclick = () => {
    if (sentences[currentSentence]) {
        speak(sentences[currentSentence].SENTENCE);
    }
};
practiceBox.appendChild(listenBtn);

const speakBtn = document.createElement("button");
speakBtn.textContent = "🎤 Bé nói";
speakBtn.style.marginLeft = "10px";

const result = document.createElement("p");
practiceBox.appendChild(result);

speakBtn.onclick = () => {
    const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        result.textContent = "Trình duyệt chưa hỗ trợ nhận diện giọng nói.";
        return;
    }

    if (!sentences.length) return;

    const recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.interimResults = false;

    result.textContent = "🎤 Đang nghe con nói...";

    recognition.onresult = (event) => {
        if (!sentences[currentSentence]) return;
        const heard = event.results[0][0].transcript;
        const target = sentences[currentSentence].SENTENCE;
        const heardNormalized = normalizeSpeech(heard);
        const targetNormalized = normalizeSpeech(target);

        const correct = speechMatches(heard, target) ||
            (targetNormalized === "hello i'm mai" &&
                ["hello am i", "hello i'm my", "hello my"].includes(heardNormalized)) ||
            (targetNormalized === "goodbye mai" &&
                ["goodbye my", "goodbye may"].includes(heardNormalized));

        if (correct) {
            sentenceAttempts = 0;
            result.textContent = "🌟 Giỏi lắm! Con đã nói đúng!";
            speak("Great job!");
        } else {
            sentenceAttempts++;
            if (sentenceAttempts < 3) {
                result.textContent = "😊 Cô nghe được: " + heard +
                    ". Con thử lại nhé! (" + sentenceAttempts + "/3 lần)";
                return;
            }
            sentenceAttempts = 0;
            result.textContent = "🌷 Con đã rất cố gắng! Mình nói câu tiếp theo nhé!";
        }

        currentSentence++;
        if (currentSentence < sentences.length) {
            targetText.textContent = sentences[currentSentence].SENTENCE;
        } else {
            result.textContent = "🎉 Tuyệt vời! Con đã hoàn thành phần luyện nói!";
            speak("Excellent!");
            currentSentence = 0;
            targetText.textContent = sentences[0].SENTENCE;
        }
    };

    recognition.onerror = () => {
        result.textContent = "😊 Con thử nói lại nhé!";
    };

    recognition.start();
};

practiceBox.appendChild(speakBtn);
        // GHI ÂM VÀ NGHE LẠI PHẦN LUYỆN NÓI

const sentenceRecordBtn = document.createElement("button");
sentenceRecordBtn.textContent = "🔴 Ghi âm";
sentenceRecordBtn.style.margin = "10px";

const sentenceStopBtn = document.createElement("button");
sentenceStopBtn.textContent = "⏹️ Dừng ghi";
sentenceStopBtn.disabled = true;

const sentenceCountdown = document.createElement("h2");
sentenceCountdown.style.color = "#ff5f7e";
sentenceCountdown.style.fontSize = "32px";

const sentencePlayback = document.createElement("audio");
sentencePlayback.controls = true;
sentencePlayback.style.display = "none";
sentencePlayback.style.margin = "15px auto";

let sentenceRecorder = null;
let sentenceChunks = [];
let sentenceStream = null;
let sentenceRecordingUrl = null;
let sentenceTimer = null;
let sentenceAutoStop = null;

function stopSentenceRecording() {
    if (sentenceRecorder && sentenceRecorder.state === "recording") {
        sentenceRecorder.stop();
    }

    clearInterval(sentenceTimer);
    clearTimeout(sentenceAutoStop);

    sentenceRecordBtn.disabled = false;
    sentenceStopBtn.disabled = true;
    sentenceCountdown.textContent = "🌟 Con hãy nghe lại nhé!";
}

sentenceRecordBtn.onclick = async () => {
    try {
        if (!navigator.mediaDevices?.getUserMedia ||
            !window.MediaRecorder) {
            alert("Trình duyệt chưa hỗ trợ ghi âm.");
            return;
        }

        sentenceRecordBtn.disabled = true;

        sentenceStream = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        sentenceChunks = [];
        sentenceRecorder = new MediaRecorder(sentenceStream);

        sentenceRecorder.ondataavailable = (event) => {
            if (event.data.size > 0) {
                sentenceChunks.push(event.data);
            }
        };

        sentenceRecorder.onstop = () => {
            const blob = new Blob(sentenceChunks, {
                type: sentenceRecorder.mimeType
            });

            if (sentenceRecordingUrl) {
                URL.revokeObjectURL(sentenceRecordingUrl);
            }

            sentenceRecordingUrl = URL.createObjectURL(blob);
            sentencePlayback.src = sentenceRecordingUrl;
            sentencePlayback.style.display = "block";

            if (sentenceStream) {
                sentenceStream.getTracks().forEach(track => track.stop());
                sentenceStream = null;
            }
        };

        sentenceRecorder.start();
        sentenceStopBtn.disabled = false;
        sentencePlayback.style.display = "none";

        let secondsLeft = 5;
        sentenceCountdown.textContent = "⏱️ " + secondsLeft;

        clearInterval(sentenceTimer);
        clearTimeout(sentenceAutoStop);

        sentenceTimer = setInterval(() => {
            secondsLeft--;
            if (secondsLeft > 0) {
                sentenceCountdown.textContent = "⏱️ " + secondsLeft;
            }
        }, 1000);

        sentenceAutoStop = setTimeout(() => {
            stopSentenceRecording();
        }, 5000);

    } catch (error) {
        sentenceRecordBtn.disabled = false;
        sentenceStopBtn.disabled = true;

        if (sentenceStream) {
            sentenceStream.getTracks().forEach(track => track.stop());
            sentenceStream = null;
        }

        alert("Chị hãy cho phép ứng dụng sử dụng micro nhé!");
    }
};

sentenceStopBtn.onclick = () => {
    stopSentenceRecording();
};

practiceBox.appendChild(sentenceRecordBtn);
practiceBox.appendChild(sentenceStopBtn);
practiceBox.appendChild(sentenceCountdown);
practiceBox.appendChild(sentencePlayback);
content.appendChild(practiceBox);

      } catch (error) {
        content.textContent =
          "Không tải được dữ liệu. Hãy kiểm tra API và quyền truy cập.";
        console.error(error);
      }
    }

    loadLesson();
  </script>
</body>
</html>
